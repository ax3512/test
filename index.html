<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #fff;
        }

        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 30px;
            font-size: 13px;
        }

        header a {
            color: #5f6368;
            text-decoration: none;
            margin-left: 15px;
        }

        header a:hover {
            text-decoration: underline;
        }

        header .apps-icon {
            width: 24px;
            height: 24px;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 8h4V4H6v4zm0 6h4v-4H6v4zm0 6h4v-4H6v4zm6-12h4V4h-4v4zm0 6h4v-4h-4v4zm0 6h4v-4h-4v4zm6-12h4V4h-4v4zm0 6h4v-4h-4v4zm0 6h4v-4h-4v4z" fill="rgba(0,0,0,.54)"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            margin-left: 15px;
        }

        header .sign-in-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 9px 23px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            margin-left: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding-bottom: 100px; /* Adjust to prevent overlap with footer */
        }

        .logo {
            margin-bottom: 20px; /* Reduced margin from 50px */
        }

        .logo img {
            width: 272px; /* Standard Google logo width */
            height: auto;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .search-box {
            display: flex;
            align-items: center; /* Vertically align items in search box */
            width: 584px;
            height: 44px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 14px; /* Keep existing padding */
            box-shadow: none;
            transition: box-shadow 0.2s;
            background-color: #fff;
            margin-bottom: 30px; /* Space between search bar and buttons */
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: rgba(223, 225, 229, 0);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding-left: 10px; /* Add some padding for text */
        }

        .search-icon {
            width: 20px;
            height: 20px;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="rgba(0,0,0,.54)" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            margin-right: 8px; /* Space between icon and input */
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            font-size: 14px;
            color: #3c4043; /* Updated text color */
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            height: 36px;
            padding: 0 16px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s; /* Smooth transition */
        }

        .btn:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            color: #202124; /* Darken text on hover */
        }

        footer { /* Changed .footer to footer */
            width: 100%;
            background-color: #f2f2f2;
            padding: 15px 30px; /* Consistent padding */
            box-sizing: border-box;
            position: fixed; /* Make footer stick to bottom */
            bottom: 0;
            left: 0;
            font-size: 14px;
            color: #70757a; /* Google's footer text color */
            border-top: 1px solid #e4e4e4; /* Subtle top border */
        }

        .footer-links {
            display: flex;
            justify-content: space-between; /* Space out link groups */
        }

        .footer-links-left a, .footer-links-right a {
            color: #70757a;
            text-decoration: none;
            margin: 0 10px; /* Adjust margin */
        }

        .footer-links-left a:hover, .footer-links-right a:hover {
            text-decoration: underline;
        }

        #aion-chatbot-container {
            position: fixed;
            bottom: 70px; /* Adjusted to be above the new fixed footer */
            right: 20px; /* Consistent spacing */
            width: 400px;
            height: 600px;
            z-index: 10000; /* Ensure it's above other elements */
        }
    </style>
</head>
<body>
    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <div class="apps-icon" title="Google apps"></div>
        <button class="sign-in-btn">Sign in</button>
    </header>

    <main>
        <div class="logo">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo">
        </div>
        <div class="search-container">
            <div class="search-box">
                <div class="search-icon"></div>
                <input type="text" placeholder="Search Google or type a URL">
            </div>
            <div class="buttons">
                <button class="btn" onclick="toggleChatbot()">Google Search</button>
                <button class="btn">I'm Feeling Lucky</button>
            </div>
        </div>
    </main>

    <div id="aion-chatbot-container">
        <!-- The chatbot will be injected here by AION script -->
    </div>

    <footer>
        <div class="footer-links">
            <div class="footer-links-left">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-links-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

<!-- Replaced with the provided chatbot script -->

 window.aionChatbotConfig = {

  //closeIcon: 'https://aion/bbb.jpg', // 채팅을 닫을때 사용하는 아이콘
  iconSize: '100%',            // 아이콘의 사이즈 (버튼의 사이즈 대비)
  totalIconSize: '3rem',       // 버튼의 사이즈
  totalBorderRadius: '1.5rem', // 버튼의 둥글기 정도
  bottom: '1rem',              // 버튼의 하단기준 위치
  right: '1rem',               // 버튼의 우측기준 위치
  chatBottom : '5rem',         // 채팅의 하단기준 위치
  chatRight : '1rem',          // 채팅의 우측기준 위치
  zoom : 1.0,                  // 채팅창 크기확대
 }
</script>
<script
 src="https://studio.abclab.ktds.com/embed.min.js"
 id="kkPWXkj1GZxxQZsH"
 defer>
</script>

<script>
function toggleChatbot() {
    // Using the aionChatbot.openPopup function
    if (window.aionChatbot && window.aionChatbot.openPopup) {
        window.aionChatbot.openPopup();
    }
}
</script>
</body>
</html>
